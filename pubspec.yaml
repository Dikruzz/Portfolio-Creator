name: portique
version: 0.1.0+1
publish_to: "none"
description: "Portique is a premium AI-powered portfolio creation app built with Flutter and Riverpod."

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  firebase_core: ^3.9.0
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.6.0
  google_fonts: ^6.2.1
  intl: ^0.20.1
  collection: ^1.19.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
